  - path: /opt/minecraft/config/bluemap/storages/file.conf
    content: |
      storage-type: file
      root: "/opt/bluemap/web/maps"
  - path: /opt/minecraft/config/bluemap/maps/overworld.conf
    content: |
      world: "/opt/minecraft/world"
      dimension: "minecraft:overworld"
      name: "Overworld"
      min-inhabited-time: 1
      remove-caves-below-y: 10000
      cave-detection-ocean-floor: -5
  - path: /opt/minecraft/config/bluemap/maps/nether.conf
    content: |
      world: "/opt/minecraft/world"
      dimension: "minecraft:the_nether"
      name: "Nether"
      sorting: 100
      sky-color: "#290000"
      void-color: "#150000"
      ambient-light: 0.6
      min-inhabited-time: 1
      remove-caves-below-y: -10000
      render-mask: [{}, {subtract: true, min-y: 90, max-y: 127}]
  - path: /opt/minecraft/config/bluemap/maps/end.conf
    content: |
      world: "/opt/minecraft/world"
      dimension: "minecraft:the_end"
      name: "End"
      sorting: 200
      sky-color: "#080010"
      void-color: "#080010"
      ambient-light: 0.6
      min-inhabited-time: 1
      remove-caves-below-y: -10000
  - path: /opt/minecraft/server.properties
    permissions: "0640"
    content: |
      difficulty=hard
      motd=§a§lmc.ola-vassbotn.no
      simulation-distance=20
      view-distance=32
      white-list=true
