  - path: /opt/bluemap/web/status.js
    content: |
      document.querySelector("#app").__vue_app__.config.globalProperties.$i18n.locale = "en";

      const panel = document.createElement("div");
      const settings = document.createElement("div");
      const card = document.createElement("div");
      const nav = document.createElement("nav");
      const gear = document.createElement("button");
      const who = document.createElement("p");
      const players = document.createElement("div");
      players.id = "mc-players";
      panel.id = "mc-panel";
      settings.id = "mc-settings";
      settings.hidden = true;
      gear.textContent = "⚙︎";
      gear.title = "Settings";
      gear.onclick = () => gear.classList.toggle("active", !(settings.hidden = !settings.hidden));
      card.append(nav, who, players);
      document.title = "Minecraft World Map | mc.ola-vassbotn.no";
      const favicon = document.querySelector("link[rel~=icon]") || document.createElement("link");
      favicon.rel = "icon";
      favicon.href = "/server-icon.png";
      document.head.append(favicon);
      new MutationObserver(() => {
        if (document.title !== "Minecraft World Map | mc.ola-vassbotn.no") document.title = "Minecraft World Map | mc.ola-vassbotn.no";
      }).observe(document.querySelector("title"), { childList: true });
      panel.append(settings, card);
      document.querySelector(".control-bar").parentElement.prepend(panel);

      const slider = (name, key, min, max, step) => {
        const label = document.createElement("label");
        const value = document.createElement("span");
        const input = document.createElement("input");
        Object.assign(input, { type: "range", min, max, step, value: bluemap.mapViewer.data[key] });
        value.textContent = input.value;
        input.oninput = () => {
          value.textContent = input.value;
          bluemap.mapViewer.data[key] = +input.value;
          bluemap.mapViewer.updateLoadedMapArea();
        };
        input.onchange = () => bluemap.saveUserSettings();
        label.append(name, value, input);
        return label;
      };
      const full = document.createElement("button");
      full.textContent = "Fullscreen";
      full.hidden = !document.fullscreenEnabled;
      full.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen();
      document.addEventListener("fullscreenchange", () => full.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen");
      const limits = bluemap.settings;
      settings.append(
        slider("Hi-res", "loadedHiresViewDistance", limits.hiresSliderMin, limits.hiresSliderMax, 10),
        slider("Low-res", "loadedLowresViewDistance", limits.lowresSliderMin, limits.lowresSliderMax, 100),
        full,
      );

      const explored = id => Promise.all(["x0/z0", "x0/z-1", "x-1/z0", "x-1/z-1"].map(tile => fetch(`maps/${id}/tiles/3/${tile}.png`).then(r => r.status === 200))).then(found => found.includes(true));
      const buttons = bluemap.maps.map(map => {
        const button = document.createElement("button");
        button.textContent = map.data.name;
        button.onclick = () => bluemap.switchMap(map.data.id);
        explored(map.data.id).then(found => button.disabled = !found);
        nav.append(button);
        return [map.data.id, button];
      });
      nav.append(gear);
      const mark = () => buttons.forEach(([id, button]) => button.classList.toggle("active", id === bluemap.mapViewer.map?.data.id));

      const edge = "if (distance < 800.0 && color.a == 0.0) discard;";
      const cut = edge + `
        vec2 quad = vec2(tileSize.x + 1.0) / ceil(50.0 / lod);
        vec2 corner = floor(vPosition.xz / quad) * quad;
        if (texture(textureImage, posToColorUV(corner)).a * texture(textureImage, posToColorUV(corner + vec2(quad.x, 0.0))).a * texture(textureImage, posToColorUV(corner + vec2(0.0, quad.y))).a * texture(textureImage, posToColorUV(corner + quad)).a == 0.0) discard;`;
      const cutWalls = () => bluemap.mapViewer.map.lowresTileManager.forEach(manager => {
        const shaders = [manager.tileLoader];
        manager.scene.traverse(o => o.material?.fragmentShader && shaders.push(o.material));
        shaders.filter(shader => !shader.fragmentShader.includes("vec2 corner")).forEach(shader => {
          shader.fragmentShader = shader.fragmentShader.replace(edge, cut);
          shader.needsUpdate = true;
        });
      });

      const update = () => { mark(); cutWalls(); document.title = "Minecraft World Map | mc.ola-vassbotn.no"; };
      bluemap.events.addEventListener("bluemapMapChanged", update);
      update();

      const controls = bluemap.mapControls;
      const ground = point => {
        const camera = bluemap.mapViewer.camera;
        const rect = bluemap.mapViewer.renderer.domElement.getBoundingClientRect();
        const [near, far] = [-1, 1].map(z => camera.position.clone().set((point.x - rect.left) / rect.width * 2 - 1, (rect.top - point.y) / rect.height * 2 + 1, z).unproject(camera));
        const t = (controls.manager.lastPosition.y - near.y) / (far.y - near.y);
        return t > 0 && Number.isFinite(t) ? near.lerp(far, t) : null;
      };
      const towardPoint = (zoom, point) => {
        const step = zoom.update.bind(zoom);
        zoom.update = (delta, map) => {
          const manager = controls.manager;
          const before = manager.distance;
          const target = point() && ground(point());
          step(delta, map);
          const scale = Math.min(Math.max(manager.distance, controls.minDistance), controls.maxDistance) / before;
          if (!target || scale === 1) return;
          manager.position.x = target.x + scale * (manager.position.x - target.x);
          manager.position.z = target.z + scale * (manager.position.z - target.z);
        };
      };
      let cursor = null;
      let pinch = null;
      controls.mouseZoom.target.addEventListener("wheel", e => cursor = { x: e.clientX, y: e.clientY });
      addEventListener("pointerdown", () => cursor = null, true);
      controls.hammer.on("zoomstart zoommove", e => pinch = e.center);
      towardPoint(controls.mouseZoom, () => cursor);
      towardPoint(controls.touchZoom, () => pinch);
      addEventListener("mousedown", () => controls.mouseRotate.moving && controls.rootElement.requestPointerLock()?.catch(() => {}));
      addEventListener("mouseup", () => controls.mouseRotate.moving && document.exitPointerLock(), true);
      addEventListener("mousemove", e => {
        if (controls.mouseRotate.moving && document.pointerLockElement) [controls.mouseRotate.lastX, controls.mouseAngle.lastY] = [e.x - e.movementX, e.y - e.movementY];
      }, true);

      const follow = async id => {
        const cm = bluemap.mapViewer.controlsManager;
        if (cm.controls === bluemap.freeFlightControls) bluemap.setPerspectiveView(0, 40);
        cm.controls?.stopFollowingPlayerMarker?.();
        let marker = bluemap.playerMarkerManager?.getPlayerMarker(id);
        if (!marker || marker.data.foreign) {
          const map = await bluemap.findPlayerMap(id);
          if (map) await bluemap.switchMap(map.data.id, false);
          marker = map && bluemap.playerMarkerManager?.getPlayerMarker(id);
        }
        if (marker?.visible) {
          cm.controls?.followPlayerMarker?.(marker);
          cm.position.copy(marker.position);
        }
        tick();
      };

      let nicknames = {};
      const nick = () => fetch("nicknames.json", { cache: "no-store" }).then(r => r.json()).then(data => nicknames = data).catch(() => {});
      const updateFromData = BlueMap.PlayerMarker.prototype.updateFromData;
      BlueMap.PlayerMarker.prototype.updateFromData = function (data) {
        updateFromData.call(this, { ...data, name: nicknames[this.data.playerUuid]?.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`) ?? data.name });
      };
      nick();
      setInterval(nick, 10000);

      let max = "";
      fetch("status.json", { cache: "no-store" }).then(r => r.json()).then(status => max = `/${status.players.max}`).catch(() => {});

      let listed = "";
      const tick = () => {
        const online = [...bluemap.mapViewer.markers.markerSets.get("bm-players")?.markers.values() ?? []].map(marker => marker.data);
        const key = online.map(player => player.playerUuid + player.name).join();
        who.textContent = `${online.length}${max} online`;
        if (key !== listed) {
          listed = key;
          players.replaceChildren(...online.map(player => {
            const row = document.createElement("button");
            const head = document.createElement("img");
            const name = document.createElement("span");
            row.value = player.playerUuid;
            row.onclick = () => follow(player.playerUuid);
            head.addEventListener("error", () => head.src = "assets/steve.png", { once: true });
            head.src = `${bluemap.mapViewer.map?.data.mapDataRoot}/assets/playerheads/${player.playerUuid}.png`;
            head.alt = "";
            head.width = 24;
            head.height = 24;
            name.textContent = nicknames[player.playerUuid] ?? player.name;
            row.append(head, name);
            return row;
          }));
        }
        const following = bluemap.mapViewer.controlsManager.controls?.data?.followingPlayer?.playerUuid;
        players.querySelectorAll("button").forEach(row => row.classList.toggle("active", row.value === following));
      };
      tick();
      setInterval(tick, 1000);

      const Three = BlueMap.Three;
      const parts = [
        ["head", 8, 8, 8, 0, 0, 32, 0, 0.5, 0, 28, 24],
        ["body", 8, 12, 4, 16, 16, 16, 32, 0.25, 0, 18, 18],
        ["rightArm", 4, 12, 4, 40, 16, 40, 32, 0.25, -6, 18, 22],
        ["leftArm", 4, 12, 4, 32, 48, 48, 48, 0.25, 6, 18, 22],
        ["rightLeg", 4, 12, 4, 0, 16, 0, 32, 0.25, -2, 6, 12],
        ["leftLeg", 4, 12, 4, 16, 48, 0, 48, 0.25, 2, 6, 12],
      ];
      const boxes = {};
      const box = (w, h, d, u, v, grow, size) => boxes[[w, h, d, u, v, grow, size]] ??= (() => {
        const geometry = new Three.BoxGeometry(w + grow * 2, h + grow * 2, d + grow * 2);
        [[u + d + w, v + d, d, h], [u, v + d, d, h], [u + d, v, w, d], [u + d + w, v, w, d], [u + d, v + d, w, h], [u + 2 * d + w, v + d, w, h]].forEach(([x, y, fw, fh], face) => {
          const [l, r, t, b] = [x / 64, (x + fw) / 64, 1 - y / size, 1 - (y + fh) / size];
          (face === 3 ? [[l, b], [r, b], [l, t], [r, t]] : [[l, t], [r, t], [l, b], [r, b]]).forEach(([s, q], i) => geometry.attributes.uv.setXY(face * 4 + i, s, q));
        });
        return geometry;
      })();

      const skins = new Map();
      const skin = id => {
        if (!skins.has(id)) {
          const entry = {};
          skins.set(id, entry);
          Promise.all([fetch("skins/models.json", { cache: "no-store" }).then(r => r.json()), new Three.TextureLoader().loadAsync(`skins/${id}.png`)]).then(([models, texture]) => {
            Object.assign(texture, { magFilter: Three.NearestFilter, minFilter: Three.NearestFilter, generateMipmaps: false, colorSpace: Three.SRGBColorSpace });
            Object.assign(entry, {
              slim: models[id] === "slim",
              size: texture.image.height,
              base: new Three.MeshBasicMaterial({ map: texture, alphaTest: 0.5 }),
              overlay: new Three.MeshBasicMaterial({ map: texture, alphaTest: 0.5, side: Three.DoubleSide }),
            });
          }).catch(() => setTimeout(() => skins.delete(id), 30000));
        }
        return skins.get(id);
      };

      const build = entry => {
        const model = new Three.Group();
        const limbs = {};
        const legacy = entry.size === 32;
        for (const [name, w, h, d, u, v, ou, ov, grow, x, y, pivot] of parts) {
          const slim = entry.slim && name.endsWith("Arm");
          const [bu, bv] = legacy ? parts.find(part => part[0] === name.replace("left", "right")).slice(4, 6) : [u, v];
          const layers = [[bu, bv, 0, entry.base], ...(!legacy || name === "head" ? [[ou, ov, grow, entry.overlay]] : [])];
          const group = limbs[name] = new Three.Group();
          group.position.set(slim ? Math.sign(x) * 5.5 : x, pivot, 0);
          for (const [lu, lv, lg, material] of layers) {
            const mesh = new Three.Mesh(box(slim ? 3 : w, h, d, lu, lv, lg, entry.size), material);
            mesh.position.y = y - pivot;
            group.add(mesh);
          }
          model.add(group);
        }
        model.scale.setScalar(0.9375 / 16);
        model.position.y = -1.8;
        return { model, limbs, speed: 0, phase: 0 };
      };

      let last = performance.now();
      const animate = now => {
        requestAnimationFrame(animate);
        const dt = Math.max(now - last, 1) / 1000;
        last = now;
        const camera = bluemap.mapViewer.camera;
        let shown = false;
        for (const marker of bluemap.mapViewer.markers.markerSets.get("bm-players")?.markers.values() ?? []) {
          const entry = skin(marker.data.playerUuid);
          if (!marker.userData.mc && entry.base) {
            marker.userData.mc = { ...build(entry), x: marker.position.x, z: marker.position.z };
            marker.add(marker.userData.mc.model);
          }
          const mc = marker.userData.mc;
          if (!mc) continue;
          const { x, z } = marker.position;
          mc.speed += (Math.hypot(x - mc.x, z - mc.z) / dt - mc.speed) * (1 - Math.exp(-dt / 0.5));
          [mc.x, mc.z] = [x, z];
          const near = marker.visible && marker.position.distanceTo(camera.position) < 1.875 * innerHeight / 64 / Math.tan(camera.fov * Three.MathUtils.DEG2RAD / 2);
          mc.model.visible = near;
          marker.element.classList.toggle("mc-model", near);
          if (!near) continue;
          const pace = Math.min(mc.speed, 8);
          const swing = Math.sin(mc.phase += pace * dt * 2.66) * 0.6 * pace / 4.3;
          mc.model.rotation.y = -marker.data.rotation.yaw * Three.MathUtils.DEG2RAD;
          mc.limbs.head.rotation.x = marker.data.rotation.pitch * Three.MathUtils.DEG2RAD;
          mc.limbs.rightLeg.rotation.x = mc.limbs.leftArm.rotation.x = swing;
          mc.limbs.leftLeg.rotation.x = mc.limbs.rightArm.rotation.x = -swing;
          shown = true;
        }
        if (shown) bluemap.mapViewer.redraw();
      };
      requestAnimationFrame(animate);
  - path: /opt/bluemap/web/status.css
    content: |
      @font-face {
        font-family: Minecraft;
        src: url("/fonts/minecraft-regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: Minecraft;
        src: url("/fonts/minecraft-bold.woff2") format("woff2");
        font-weight: 700;
      }
      :root, :root .theme-light, :root .theme-dark, :root .theme-contrast {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        --theme-bg: rgba(20, 20, 24, .75);
        --theme-bg-hover: rgba(48, 48, 56, .85);
        --theme-bg-light: rgba(82, 82, 92, .9);
        --theme-fg: #f4f4f5;
        --theme-fg-light: #b4b4bc;
        --theme-switch-button-on: #3b82f6;
        --theme-stars-day: #fff;
        --theme-moon-day: #ff0;
        --theme-stars-night: #444;
        --theme-moon-night: #000;
      }
      #app input {
        font: inherit;
      }
      #app .control-bar {
        gap: .375em;
        filter: none;
      }
      #app .control-bar > :not(.space), #zoom-buttons, #mc-panel > div, #map-container .bm-marker-popup {
        border: none;
        border-radius: .625em;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #app .control-bar > :not(.space), #zoom-buttons, #mc-panel > div {
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
      }
      #app .control-bar > .space:not(.greedy), #app .control-bar > :has(~ .space.greedy) {
        display: none;
      }
      #map-container .bm-marker-player {
        filter: none;
      }
      #map-container .bm-marker-player img {
        filter: drop-shadow(1px 1px 3px #0008);
      }
      #map-container .bm-marker-player.mc-model img {
        display: none;
      }
      #map-container .bm-marker-player .bm-player-name {
        padding: .25em .5em;
        border-radius: .5em;
        font-family: Minecraft, system-ui, sans-serif;
        color: var(--theme-fg);
        background: var(--theme-bg);
        box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #zoom-buttons {
        filter: none;
      }
      #zoom-buttons > * + * {
        border-top: solid 1px var(--theme-bg-light);
      }
      #mc-panel {
        position: fixed;
        left: .5em;
        bottom: .5em;
        display: flex;
        flex-direction: column;
        gap: .375em;
        line-height: 1.25;
        color: var(--theme-fg);
      }
      #mc-panel > div {
        pointer-events: auto;
        padding: .25em;
        background: var(--theme-bg);
      }
      #mc-panel nav {
        display: flex;
        gap: .25em;
      }
      #mc-panel button {
        padding: .375em .75em;
        border: 0;
        border-radius: .5em;
        font: inherit;
        color: inherit;
        background: none;
        cursor: pointer;
      }
      #mc-panel button:hover {
        background: var(--theme-bg-hover);
      }
      #mc-panel button.active {
        background: var(--theme-bg-light);
      }
      #mc-panel button:disabled {
        opacity: .4;
        background: none;
        cursor: default;
      }
      #mc-panel nav button:last-child {
        margin-left: auto;
        padding: .375em .5em;
      }
      #mc-panel p {
        margin: 0;
        padding: .25em .5em 0;
      }
      #mc-panel p::before {
        content: "●";
        margin-right: .4em;
        color: #22c55e;
      }
      #mc-players {
        display: grid;
        gap: .25em;
        padding: .25em 0;
        font-family: Minecraft, system-ui, sans-serif;
      }
      #mc-players > button {
        display: flex;
        align-items: center;
        gap: .5em;
        padding: .25em .5em;
      }
      #mc-players img {
        image-rendering: pixelated;
      }
      #mc-settings label {
        display: grid;
        grid-template-columns: 1fr auto;
        padding: .25em .5em;
      }
      #mc-settings label span {
        color: var(--theme-fg-light);
      }
      #mc-settings input {
        grid-column: span 2;
        width: 100%;
        margin: .375em 0;
        accent-color: var(--theme-fg);
      }
      #mc-settings button {
        width: 100%;
        text-align: left;
      }
      @media (max-width: 575.98px) {
        #app .control-bar {
          margin: .5em;
          width: calc(100% - 1em);
          background: none;
        }
        #app .control-bar > .thin-hide {
          display: block;
        }
        #app .control-bar > .controls-switch {
          display: flex;
        }
        #app .control-bar > .pos-input, #zoom-buttons {
          display: none;
        }
        #mc-panel {
          font-size: .75em;
        }
      }
