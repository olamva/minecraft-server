#cloud-config
package_update: true
packages:
  - openjdk-25-jre-headless
  - iptables-persistent
  - caddy
  - rsync
users:
  - default
  - name: minecraft
    system: true
    homedir: /opt/minecraft
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/systemd/system/minecraft.socket
    content: |
      [Unit]
      PartOf=minecraft.service

      [Socket]
      ListenFIFO=/run/minecraft.stdin
      SocketMode=0600
      RemoveOnStop=true
  - path: /etc/systemd/system/minecraft.service
    content: |
      [Unit]
      Wants=network-online.target
      After=network-online.target minecraft.socket
      Requires=minecraft.socket

      [Service]
      User=minecraft
      WorkingDirectory=/opt/minecraft
      ExecStartPre=-/usr/bin/python3 -I /usr/local/bin/bluemap-start-pos
      ExecStart=/usr/bin/java -XX:InitialRAMPercentage=80 -XX:MaxRAMPercentage=80 -Dfabric.installer.server.gameJar=server.jar -jar fabric-server-launch.jar nogui
      Sockets=minecraft.socket
      StandardInput=socket
      StandardOutput=journal
      StandardError=journal
      Restart=on-failure
      TimeoutStopSec=120

      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/bin/mc
    permissions: "0755"
    content: |
      #!/bin/sh
      echo "$*" > /run/minecraft.stdin
  - path: /usr/local/bin/bluemap-start-pos
    content: |
      import glob, re, statistics, zlib
      inhabited = b"\x04\x00\x0dInhabitedTime"
      full = b"\x08\x00\x06Status\x00\x0eminecraft:full"
      for conf in glob.glob("/opt/minecraft/config/bluemap/maps/*.conf"):
          text = open(conf).read()
          world = re.search(r'^world: "(.+)"', text, re.M)[1]
          namespace, dimension = re.search(r'^dimension: "(.+):(.+)"', text, re.M).groups()
          explored, generated = set(), set()
          for region in glob.glob(f"{world}/dimensions/{namespace}/{dimension}/region/r.*.mca"):
              rx, rz = map(int, re.findall(r"r\.(-?\d+)\.(-?\d+)\.mca$", region)[0])
              data = open(region, "rb").read()
              for i in range(1024):
                  offset = int.from_bytes(data[i * 4:i * 4 + 3]) * 4096
                  if not offset or data[offset + 4] != 2:
                      continue
                  nbt = zlib.decompress(data[offset + 5:offset + 4 + int.from_bytes(data[offset:offset + 4])])
                  chunk = (rx * 32 + i % 32, rz * 32 + i // 32)
                  if full in nbt:
                      generated.add(chunk)
                  at = nbt.find(inhabited) + len(inhabited)
                  if at >= len(inhabited) and int.from_bytes(nbt[at:at + 8], signed=True) > 0:
                      explored.add(chunk)
          x = z = 0
          if explored and not generated & {(0, 0), (-1, 0), (0, -1), (-1, -1)}:
              x, z = (statistics.median_low(axis) * 16 + 8 for axis in zip(*explored))
          open(conf, "w").write(re.sub(r"^start-pos:.*\n", "", text, flags=re.M) + f"start-pos: {{ x: {x}, z: {z} }}\n")
          print(conf, x, z, len(explored), len(generated))
  - path: /etc/systemd/system/mcstatus.service
    content: |
      [Service]
      User=minecraft
      ExecStart=/bin/sh -c 'while :; do python3 -I /usr/local/bin/ping.py localhost 25565 > /opt/bluemap/web/status.json; python3 -I /usr/local/bin/mc-skins; python3 -I /usr/local/bin/mc-nicknames; sleep 10; done'
      Restart=always

      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/bin/mc-skins
    content: |
      import base64, json, os, time, urllib.request
      skins = "/opt/bluemap/web/skins"
      try:
          players = json.load(open("/opt/bluemap/web/status.json"))["players"].get("sample", [])
      except (OSError, ValueError):
          raise SystemExit
      try:
          models = json.load(open(f"{skins}/models.json"))
      except (OSError, ValueError):
          models = {}
      for player in players:
          path = f"{skins}/{player['id']}.png"
          if os.path.exists(path) and time.time() - os.path.getmtime(path) < 86400:
              continue
          try:
              profile = json.load(urllib.request.urlopen(f"https://sessionserver.mojang.com/session/minecraft/profile/{player['id'].replace('-', '')}", timeout=10))
              skin = json.loads(base64.b64decode(profile["properties"][0]["value"]))["textures"]["SKIN"]
              png = urllib.request.urlopen(skin["url"].replace("http:", "https:", 1), timeout=10).read()
          except (OSError, ValueError, LookupError):
              continue
          models[player["id"]] = skin.get("metadata", {}).get("model", "classic")
          json.dump(models, open(f"{skins}/models.json", "w"))
          open(path, "wb").write(png)
  - path: /usr/local/bin/mc-nicknames
    content: |
      import glob, gzip, json, os, re
      nicknames = {}
      for path in glob.glob("/opt/minecraft/world/modplayerdata/*.dat"):
          try:
              data = gzip.open(path).read()
          except (OSError, EOFError):
              continue
          if match := re.search(rb"\x08\x00\x08nickname(..)", data, re.S):
              nicknames[os.path.basename(path)[:-4]] = data[match.end():match.end() + int.from_bytes(match[1])].decode(errors="replace")
      json.dump(nicknames, open("/opt/bluemap/web/nicknames.json", "w"))
  - path: /usr/local/bin/mc-backup
    permissions: "0755"
    content: |
      #!/bin/sh
      set -e
      b=/var/backups/minecraft
      mkdir -p -m 700 $b
      [ -e $b/latest ] && [ -z "$(find /opt/minecraft/world/players -newer $b/latest -print -quit)" ] && exit 0
      t=$(date +%s)
      trap 'mc save-on' EXIT
      mc save-off
      mc save-all flush
      timeout 300 sh -c "until journalctl -u minecraft --since @$t | grep -q 'Saved the game'; do sleep 1; done"
      d=$b/$(date -u +%Y%m%dT%H%MZ)
      rsync -a --link-dest=$b/latest /opt/minecraft/world/ $d/
      ln -sfn $d $b/latest
      ls -d $b/2* | head -n -48 | xargs -r rm -rf
  - path: /etc/systemd/system/mc-backup.service
    content: |
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/mc-backup
  - path: /etc/systemd/system/mc-backup.timer
    content: |
      [Timer]
      OnCalendar=*:0/30

      [Install]
      WantedBy=timers.target
  - path: /etc/caddy/Caddyfile
    defer: true
    content: |
      mc.ola-vassbotn.no {
        header /status.* Cache-Control no-cache
        @font path /fonts/*.woff2
        handle @font {
          reverse_proxy 127.0.0.1:8100 {
            header_down Content-Type font/woff2
          }
        }
        handle {
          reverse_proxy 127.0.0.1:8100
        }
      }
  - path: /opt/minecraft/config/bluemap/core.conf
    content: |
      accept-download: true
      data: "/opt/bluemap/data"
      render-thread-count: 2
  - path: /opt/minecraft/config/bluemap/webserver.conf
